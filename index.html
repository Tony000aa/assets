<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tony 資產總覽</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg:#0d1117; --bg2:#161b22; --bg3:#21262d; --border:#30363d;
    --text:#e6edf3; --text2:#8b949e;
    --green:#3fb950; --red:#f85149; --blue:#58a6ff;
    --accent:#1f6feb; --yellow:#d29922;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;font-size:14px;}

  header{background:var(--bg2);border-bottom:1px solid var(--border);padding:12px 20px;
    display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
  header h1{font-size:17px;font-weight:700;color:var(--blue);}
  .hdr-r{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  #last-update{font-size:11px;color:var(--text2);}

  .btn{background:var(--accent);color:#fff;border:none;border-radius:6px;padding:6px 13px;
    cursor:pointer;font-size:13px;font-weight:600;transition:opacity .2s;}
  .btn:hover{opacity:.85;}
  .btn-sm{padding:3px 9px;font-size:12px;}
  .btn-danger{background:var(--red);}
  .btn-success{background:#238636;}
  .btn-outline{background:transparent;border:1px solid var(--border);color:var(--text);}
  .btn-outline:hover{background:var(--bg3);}

  main{max-width:1200px;margin:0 auto;padding:18px 14px 40px;}

  .summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:10px;margin-bottom:18px;}
  .card{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:14px 18px;}
  .card-label{font-size:11px;color:var(--text2);margin-bottom:5px;}
  .card-value{font-size:20px;font-weight:700;}
  .card-sub{font-size:11px;color:var(--text2);margin-top:3px;}
  .pos{color:var(--green);} .neg{color:var(--red);} .neu{color:var(--text2);}

  .chart-card{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:14px 18px;margin-bottom:18px;}
  .chart-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
  .chart-header h2{font-size:14px;font-weight:600;}
  .range-btns{display:flex;gap:5px;}
  .range-btn{background:var(--bg3);border:1px solid var(--border);color:var(--text2);
    border-radius:5px;padding:3px 9px;font-size:12px;cursor:pointer;transition:all .15s;}
  .range-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);}
  .chart-wrap{height:190px;}

  .section{margin-bottom:18px;}
  .section-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .section-title{font-size:14px;font-weight:700;display:flex;align-items:center;gap:7px;}
  .badge{background:var(--bg3);border:1px solid var(--border);border-radius:20px;padding:2px 9px;font-size:11px;color:var(--text2);}
  .section-actions{display:flex;gap:6px;align-items:center;}
  .section-info{font-size:12px;color:var(--text2);}

  table{width:100%;border-collapse:collapse;background:var(--bg2);border:1px solid var(--border);border-radius:10px;overflow:hidden;}
  thead{background:var(--bg3);}
  th{padding:9px 12px;text-align:right;font-size:11px;color:var(--text2);font-weight:600;white-space:nowrap;}
  th:first-child{text-align:left;}
  td{padding:10px 12px;text-align:right;border-top:1px solid var(--border);font-size:13px;white-space:nowrap;}
  td:first-child{text-align:left;}
  tr:hover td{background:rgba(255,255,255,.025);}
  .ticker{font-weight:700;color:var(--blue);}
  .name-cell{color:var(--text2);font-size:11px;}
  .act{display:flex;gap:4px;justify-content:flex-end;}

  .spin{display:inline-block;width:11px;height:11px;border:2px solid var(--border);border-top-color:var(--blue);
    border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle;}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* Modal */
  .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;align-items:center;justify-content:center;}
  .modal-overlay.open{display:flex;}
  .modal{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:22px;width:380px;max-width:95vw;max-height:90vh;overflow-y:auto;}
  .modal h3{font-size:15px;margin-bottom:16px;}
  .fg{margin-bottom:12px;}
  .fg label{display:block;font-size:11px;color:var(--text2);margin-bottom:4px;}
  .fg input,.fg select{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:6px;
    color:var(--text);padding:7px 11px;font-size:13px;outline:none;transition:border-color .2s;}
  .fg input:focus,.fg select:focus{border-color:var(--accent);}
  .modal-footer{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .info-box{background:var(--bg3);border-radius:6px;padding:10px 12px;font-size:12px;color:var(--text2);margin-bottom:12px;line-height:1.7;}
  .info-box b{color:var(--text);}

  /* Bank */
  .bank-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:9px;}
  .bank-card{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:13px 15px;
    display:flex;justify-content:space-between;align-items:center;}
  .bank-name{font-weight:600;margin-bottom:2px;}
  .bank-note{font-size:11px;color:var(--text2);}
  .bank-amount{font-size:17px;font-weight:700;}
  .bank-acts{display:flex;gap:4px;margin-top:5px;}

  /* Transaction log */
  .txn-section{margin-bottom:18px;}
  .txn-toggle{background:none;border:none;color:var(--text2);cursor:pointer;font-size:12px;padding:4px 0;}
  .txn-toggle:hover{color:var(--text);}
  #txn-log{display:none;}

  .empty-hint{text-align:center;padding:22px;color:var(--text2);font-size:13px;}
  .price-err{color:var(--red);font-size:11px;}

  @media(max-width:640px){
    .summary-grid{grid-template-columns:1fr 1fr;}
    th,td{padding:7px 7px;font-size:12px;}
  }
</style>
</head>
<body>
<header>
  <h1>📊 Tony 資產總覽</h1>
  <div class="hdr-r">
    <span id="last-update">—</span>
    <button class="btn btn-outline btn-sm" onclick="refreshAll()">↻ 刷新</button>
    <button class="btn btn-sm" onclick="openAddModal('tw')">+ 台股</button>
    <button class="btn btn-sm" onclick="openAddModal('us')">+ 美股</button>
    <button class="btn btn-sm" onclick="openAddModal('bank')">+ 存摺</button>
  </div>
</header>

<main>
  <!-- Summary -->
  <div class="summary-grid">
    <div class="card">
      <div class="card-label">總資產（TWD）</div>
      <div class="card-value" id="c-total">—</div>
      <div class="card-sub" id="c-total-sub">台股＋美股＋存款</div>
    </div>
    <div class="card">
      <div class="card-label">未實現損益</div>
      <div class="card-value" id="c-upnl">—</div>
      <div class="card-sub" id="c-upnl-pct">—</div>
    </div>
    <div class="card">
      <div class="card-label">已實現損益</div>
      <div class="card-value" id="c-rpnl">—</div>
      <div class="card-sub" id="c-rpnl-sub">歷史累積</div>
    </div>
    <div class="card">
      <div class="card-label">台股市值</div>
      <div class="card-value" id="c-tw">—</div>
      <div class="card-sub" id="c-tw-sub">—</div>
    </div>
    <div class="card">
      <div class="card-label">美股市值（TWD）</div>
      <div class="card-value" id="c-us">—</div>
      <div class="card-sub" id="c-us-sub">—</div>
    </div>
    <div class="card">
      <div class="card-label">銀行存款 ／ 匯率</div>
      <div class="card-value" id="c-bank">—</div>
      <div class="card-sub" id="c-rate">USD/TWD —</div>
    </div>
  </div>

  <!-- Chart -->
  <div class="chart-card">
    <div class="chart-header">
      <h2>總資產走勢</h2>
      <div class="range-btns">
        <button class="range-btn active" onclick="setRange(this,30)">30D</button>
        <button class="range-btn" onclick="setRange(this,90)">90D</button>
        <button class="range-btn" onclick="setRange(this,180)">180D</button>
        <button class="range-btn" onclick="setRange(this,9999)">ALL</button>
      </div>
    </div>
    <div class="chart-wrap"><canvas id="chart"></canvas></div>
  </div>

  <!-- TW Stocks -->
  <div class="section">
    <div class="section-header">
      <div class="section-title">🇹🇼 台股 <span class="badge" id="tw-badge">0 檔</span></div>
      <div class="section-actions">
        <span class="section-info" id="tw-info"></span>
        <button class="btn btn-sm" onclick="openAddModal('tw')">+ 新增</button>
      </div>
    </div>
    <table>
      <thead><tr>
        <th>股票</th><th>現價</th><th>漲跌%</th>
        <th>股數</th><th>均價</th><th>成本</th><th>市值</th>
        <th>損益</th><th>損益%</th><th>操作</th>
      </tr></thead>
      <tbody id="tw-body">
        <tr><td colspan="10" class="empty-hint">尚無台股，點「+ 新增」或「+ 台股」</td></tr>
      </tbody>
    </table>
  </div>

  <!-- US Stocks -->
  <div class="section">
    <div class="section-header">
      <div class="section-title">🇺🇸 美股 <span class="badge" id="us-badge">0 檔</span></div>
      <div class="section-actions">
        <span class="section-info" id="us-info"></span>
        <button class="btn btn-sm" onclick="openAddModal('us')">+ 新增</button>
      </div>
    </div>
    <table>
      <thead><tr>
        <th>股票</th><th>現價(USD)</th><th>漲跌%</th>
        <th>股數</th><th>均價(USD)</th><th>成本(USD)</th><th>市值(TWD)</th>
        <th>損益(USD)</th><th>損益%</th><th>操作</th>
      </tr></thead>
      <tbody id="us-body">
        <tr><td colspan="10" class="empty-hint">尚無美股，點「+ 新增」或「+ 美股」</td></tr>
      </tbody>
    </table>
  </div>

  <!-- Bank -->
  <div class="section">
    <div class="section-header">
      <div class="section-title">🏦 存摺 <span class="badge" id="bank-badge">0 筆</span></div>
      <div class="section-actions">
        <span class="section-info" id="bank-info"></span>
        <button class="btn btn-sm" onclick="openAddModal('bank')">+ 新增</button>
      </div>
    </div>
    <div class="bank-grid" id="bank-grid">
      <div class="empty-hint" style="grid-column:1/-1">尚無存款資料</div>
    </div>
  </div>

  <!-- Transaction Log -->
  <div class="txn-section">
    <div class="section-header">
      <div class="section-title">📋 交易紀錄 <span class="badge" id="txn-badge">0 筆</span></div>
      <button class="txn-toggle" onclick="toggleTxnLog()">▼ 展開</button>
    </div>
    <div id="txn-log">
      <table>
        <thead><tr>
          <th style="text-align:left">日期</th><th style="text-align:left">類型</th>
          <th style="text-align:left">代號</th><th>股數</th><th>價格</th>
          <th>金額</th><th>已實現損益</th>
        </tr></thead>
        <tbody id="txn-body"></tbody>
      </table>
    </div>
  </div>
</main>

<!-- Modal -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <h3 id="modal-title">—</h3>
    <div id="modal-body"></div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal()">取消</button>
      <button class="btn" id="modal-save-btn" onclick="saveModal()">儲存</button>
    </div>
  </div>
</div>

<script>
// ── Storage helpers ──────────────────────────────────────────
const S = {
  get: k => { try { return JSON.parse(localStorage.getItem(k)||'null'); } catch { return null; } },
  set: (k,v) => localStorage.setItem(k, JSON.stringify(v)),
};

// ── State ────────────────────────────────────────────────────
// Holdings: [{ticker, name, shares, avgPrice, currency}]
// Transactions: [{id, date, type:'BUY'|'SELL', market:'TW'|'US', ticker, name, shares, price, realizedPnl}]
// bankEntries: [{id, bankName, note, amount}]
// assetHistory: [{date, total}]

let twH  = S.get('tw_h')   || [];
let usH  = S.get('us_h')   || [];
let bank = S.get('bank')   || [];
let txns = S.get('txns')   || [];
let hist = S.get('hist')   || [];
let usdRate = S.get('usd_rate') || 32.0;
let chartRange = 30;
let myChart = null;
let _modal = { mode: '', idx: -1 };

// ── Price fetching ───────────────────────────────────────────
async function yf(symbol) {
  const PROXIES = [
    `https://query1.finance.yahoo.com/v8/finance/chart/${symbol}?interval=1d&range=2d`,
    `https://query2.finance.yahoo.com/v8/finance/chart/${symbol}?interval=1d&range=2d`,
    `https://corsproxy.io/?https://query1.finance.yahoo.com/v8/finance/chart/${symbol}?interval=1d&range=2d`,
  ];
  for (const url of PROXIES) {
    try {
      const r = await fetch(url, { signal: AbortSignal.timeout(8000) });
      if (!r.ok) continue;
      const j = await r.json();
      const res = j?.chart?.result?.[0];
      if (!res) continue;
      const meta = res.meta;
      const price = meta.regularMarketPrice;
      if (!price) continue;
      const prev = meta.chartPreviousClose || meta.previousClose || price;
      return {
        price,
        chg: ((price - prev) / prev * 100),
        name: meta.shortName || meta.symbol || symbol,
      };
    } catch {}
  }
  return null;
}

async function fetchUsdRate() {
  const d = await yf('USDTWD=X');
  if (d && d.price > 20 && d.price < 50) {
    usdRate = parseFloat(d.price.toFixed(2));
    S.set('usd_rate', usdRate);
  }
  document.getElementById('c-rate').textContent = `USD/TWD ${usdRate.toFixed(2)}`;
}

async function fetchTwPrice(ticker) { return yf(ticker + '.TW'); }
async function fetchUsPrice(ticker) { return yf(ticker); }

// ── Render Taiwan ────────────────────────────────────────────
async function renderTw() {
  const tbody = document.getElementById('tw-body');
  document.getElementById('tw-badge').textContent = `${twH.length} 檔`;
  if (!twH.length) {
    tbody.innerHTML = '<tr><td colspan="10" class="empty-hint">尚無台股，點「+ 台股」新增</td></tr>';
    updTwCard(0,0); return 0;
  }
  tbody.innerHTML = twH.map((h,i) => `
    <tr id="twr-${i}">
      <td><div class="ticker">${h.ticker}</div><div class="name-cell">${h.name||''}</div></td>
      <td><span class="spin"></span></td>
      <td>—</td><td>${fmt(h.shares)}</td><td>${n2(h.avgPrice)}</td>
      <td>${twd(h.shares*h.avgPrice)}</td><td>—</td><td>—</td><td>—</td>
      <td class="act">
        <button class="btn btn-success btn-sm" onclick="openTrade('BUY','tw',${i})">買</button>
        <button class="btn btn-danger btn-sm" onclick="openTrade('SELL','tw',${i})">賣</button>
        <button class="btn btn-outline btn-sm" onclick="openEditHolding('tw',${i})">編</button>
        <button class="btn btn-danger btn-sm" onclick="delHolding('tw',${i})">刪</button>
      </td>
    </tr>`).join('');

  const tasks = twH.map(async (h,i) => {
    const d = await fetchTwPrice(h.ticker);
    const row = document.getElementById(`twr-${i}`);
    if (!row) return {val:0,cost:0};
    const cost = h.shares * h.avgPrice;
    if (d?.price) {
      const val = h.shares * d.price;
      const pnl = val - cost;
      const pp  = cost>0 ? pnl/cost*100 : 0;
      const cc  = d.chg>=0?'pos':'neg', pc=pnl>=0?'pos':'neg';
      twH[i].name = d.name || twH[i].name;
      row.innerHTML = `
        <td><div class="ticker">${h.ticker}</div><div class="name-cell">${d.name||h.name}</div></td>
        <td>${n2(d.price)}</td>
        <td class="${cc}">${d.chg>=0?'+':''}${d.chg.toFixed(2)}%</td>
        <td>${fmt(h.shares)}</td><td>${n2(h.avgPrice)}</td>
        <td>${twd(cost)}</td><td>${twd(val)}</td>
        <td class="${pc}">${pnl>=0?'+':''}${twd(pnl)}</td>
        <td class="${pc}">${pp>=0?'+':''}${pp.toFixed(2)}%</td>
        <td class="act">
          <button class="btn btn-success btn-sm" onclick="openTrade('BUY','tw',${i})">買</button>
          <button class="btn btn-danger btn-sm" onclick="openTrade('SELL','tw',${i})">賣</button>
          <button class="btn btn-outline btn-sm" onclick="openEditHolding('tw',${i})">編</button>
          <button class="btn btn-danger btn-sm" onclick="delHolding('tw',${i})">刪</button>
        </td>`;
      return {val, cost};
    } else {
      row.cells[1].innerHTML = '<span class="price-err">無法取得</span>';
      return {val:cost, cost};
    }
  });
  const res = await Promise.all(tasks);
  const tv = res.reduce((s,r)=>s+(r?.val||0),0);
  const tc = res.reduce((s,r)=>s+(r?.cost||0),0);
  S.set('tw_h', twH);
  updTwCard(tv, tc);
  return tv;
}

function updTwCard(v, c) {
  const p=v-c, pp=c>0?p/c*100:0;
  document.getElementById('c-tw').textContent = twd(v);
  document.getElementById('c-tw-sub').textContent =
    v>0 ? `損益 ${p>=0?'+':''}${twd(p)} (${pp.toFixed(2)}%)` : '—';
  document.getElementById('c-tw-sub').className = `card-sub ${p>=0?'pos':'neg'}`;
  document.getElementById('tw-info').textContent =
    v>0 ? `市值 ${twd(v)} ／ 損益 ${p>=0?'+':''}${pp.toFixed(2)}%` : '';
}

// ── Render US ────────────────────────────────────────────────
async function renderUs() {
  const tbody = document.getElementById('us-body');
  document.getElementById('us-badge').textContent = `${usH.length} 檔`;
  if (!usH.length) {
    tbody.innerHTML = '<tr><td colspan="10" class="empty-hint">尚無美股，點「+ 美股」新增</td></tr>';
    updUsCard(0,0); return 0;
  }
  tbody.innerHTML = usH.map((h,i) => `
    <tr id="usr-${i}">
      <td><div class="ticker">${h.ticker}</div><div class="name-cell">${h.name||''}</div></td>
      <td><span class="spin"></span></td>
      <td>—</td><td>${h.shares}</td><td>$${n2(h.avgPrice)}</td>
      <td>$${n2(h.shares*h.avgPrice)}</td><td>—</td><td>—</td><td>—</td>
      <td class="act">
        <button class="btn btn-success btn-sm" onclick="openTrade('BUY','us',${i})">買</button>
        <button class="btn btn-danger btn-sm" onclick="openTrade('SELL','us',${i})">賣</button>
        <button class="btn btn-outline btn-sm" onclick="openEditHolding('us',${i})">編</button>
        <button class="btn btn-danger btn-sm" onclick="delHolding('us',${i})">刪</button>
      </td>
    </tr>`).join('');

  const tasks = usH.map(async (h,i) => {
    const d = await fetchUsPrice(h.ticker);
    const row = document.getElementById(`usr-${i}`);
    if (!row) return {val:0,cost:0};
    const cost=h.shares*h.avgPrice, costTwd=cost*usdRate;
    if (d?.price) {
      const val=h.shares*d.price, valTwd=val*usdRate;
      const pnl=val-cost, pp=cost>0?pnl/cost*100:0;
      const cc=d.chg>=0?'pos':'neg', pc=pnl>=0?'pos':'neg';
      usH[i].name = d.name || usH[i].name;
      row.innerHTML = `
        <td><div class="ticker">${h.ticker}</div><div class="name-cell">${d.name||h.name}</div></td>
        <td>$${n2(d.price)}</td>
        <td class="${cc}">${d.chg>=0?'+':''}${d.chg.toFixed(2)}%</td>
        <td>${h.shares}</td><td>$${n2(h.avgPrice)}</td>
        <td>$${n2(cost)}</td><td>${twd(valTwd)}</td>
        <td class="${pc}">$${pnl>=0?'+':''}${n2(pnl)}</td>
        <td class="${pc}">${pp>=0?'+':''}${pp.toFixed(2)}%</td>
        <td class="act">
          <button class="btn btn-success btn-sm" onclick="openTrade('BUY','us',${i})">買</button>
          <button class="btn btn-danger btn-sm" onclick="openTrade('SELL','us',${i})">賣</button>
          <button class="btn btn-outline btn-sm" onclick="openEditHolding('us',${i})">編</button>
          <button class="btn btn-danger btn-sm" onclick="delHolding('us',${i})">刪</button>
        </td>`;
      return {val:valTwd, cost:costTwd};
    } else {
      row.cells[1].innerHTML = '<span class="price-err">無法取得</span>';
      return {val:costTwd, cost:costTwd};
    }
  });
  const res = await Promise.all(tasks);
  const tv = res.reduce((s,r)=>s+(r?.val||0),0);
  const tc = res.reduce((s,r)=>s+(r?.cost||0),0);
  S.set('us_h', usH);
  updUsCard(tv, tc);
  return tv;
}

function updUsCard(v, c) {
  const p=v-c, pp=c>0?p/c*100:0;
  document.getElementById('c-us').textContent = twd(v);
  document.getElementById('c-us-sub').textContent =
    v>0 ? `損益 ${p>=0?'+':''}${twd(p)} (${pp.toFixed(2)}%)` : '—';
  document.getElementById('c-us-sub').className = `card-sub ${p>=0?'pos':'neg'}`;
  document.getElementById('us-info').textContent =
    v>0 ? `市值 ${twd(v)} ／ 損益 ${p>=0?'+':''}${pp.toFixed(2)}%` : '';
}

// ── Render Bank ──────────────────────────────────────────────
function renderBank() {
  const grid = document.getElementById('bank-grid');
  const total = bank.reduce((s,b)=>s+b.amount,0);
  document.getElementById('bank-badge').textContent = `${bank.length} 筆`;
  document.getElementById('c-bank').textContent = twd(total);
  document.getElementById('bank-info').textContent = bank.length ? `合計 ${twd(total)}` : '';
  if (!bank.length) {
    grid.innerHTML = '<div class="empty-hint" style="grid-column:1/-1">尚無存款資料</div>';
    return 0;
  }
  grid.innerHTML = bank.map((b,i) => `
    <div class="bank-card">
      <div>
        <div class="bank-name">${b.bankName}</div>
        <div class="bank-note">${b.note||'活存'}</div>
      </div>
      <div style="text-align:right">
        <div class="bank-amount">${twd(b.amount)}</div>
        <div class="bank-acts">
          <button class="btn btn-outline btn-sm" onclick="openEditBank(${i})">編</button>
          <button class="btn btn-danger btn-sm" onclick="delBank(${i})">刪</button>
        </div>
      </div>
    </div>`).join('');
  return total;
}

// ── Transaction Log ──────────────────────────────────────────
function renderTxns() {
  document.getElementById('txn-badge').textContent = `${txns.length} 筆`;
  const tbody = document.getElementById('txn-body');
  if (!txns.length) {
    tbody.innerHTML = '<tr><td colspan="7" class="empty-hint">尚無交易紀錄</td></tr>';
    return;
  }
  tbody.innerHTML = [...txns].reverse().map(t => {
    const amount = t.shares * t.price;
    const cur = t.market === 'US' ? 'USD' : 'TWD';
    const rp = t.realizedPnl != null
      ? `<span class="${t.realizedPnl>=0?'pos':'neg'}">${t.realizedPnl>=0?'+':''}${n2(t.realizedPnl)}</span>`
      : '—';
    return `<tr>
      <td style="text-align:left">${t.date}</td>
      <td style="text-align:left"><b style="color:${t.type==='BUY'?'var(--green)':'var(--red)'}">${t.type==='BUY'?'買進':'賣出'}</b></td>
      <td style="text-align:left"><span class="ticker">${t.ticker}</span> <span class="name-cell">${t.name||''}</span></td>
      <td>${fmt(t.shares)}</td>
      <td>${n2(t.price)} ${cur}</td>
      <td>${n2(amount)} ${cur}</td>
      <td>${rp} ${t.realizedPnl!=null?cur:''}</td>
    </tr>`;
  }).join('');
}

function toggleTxnLog() {
  const el = document.getElementById('txn-log');
  const btn = document.querySelector('.txn-toggle');
  const open = el.style.display === 'block';
  el.style.display = open ? 'none' : 'block';
  btn.textContent = open ? '▼ 展開' : '▲ 收起';
}

// ── Totals & Chart ───────────────────────────────────────────
function updateTotals(twVal, usVal, bankVal) {
  const total = (twVal||0) + (usVal||0) + (bankVal||0);
  const twCost = twH.reduce((s,h)=>s+h.shares*h.avgPrice, 0);
  const usCostTwd = usH.reduce((s,h)=>s+h.shares*h.avgPrice*usdRate, 0);
  const investCost = twCost + usCostTwd;
  const investVal  = (twVal||0) + (usVal||0);
  const upnl = investVal - investCost;
  const upnlPct = investCost > 0 ? upnl/investCost*100 : 0;

  // Realized PnL from transactions
  const rpnl = txns.reduce((s,t) => s + (t.realizedPnl||0) * (t.market==='US' ? usdRate : 1), 0);

  document.getElementById('c-total').textContent = twd(total);
  document.getElementById('c-upnl').textContent = (upnl>=0?'+':'') + twd(upnl);
  document.getElementById('c-upnl').className = `card-value ${upnl>=0?'pos':'neg'}`;
  document.getElementById('c-upnl-pct').textContent = `${upnlPct>=0?'+':''}${upnlPct.toFixed(2)}% 含投資部位`;
  document.getElementById('c-rpnl').textContent = (rpnl>=0?'+':'') + twd(rpnl);
  document.getElementById('c-rpnl').className = `card-value ${rpnl>=0?'pos':'neg'}`;

  // History snapshot
  const today = new Date().toISOString().slice(0,10);
  if (total > 0) {
    const last = hist[hist.length-1];
    if (!last || last.date !== today) hist.push({date:today, total:Math.round(total)});
    else last.total = Math.round(total);
    if (hist.length > 365) hist.shift();
    S.set('hist', hist);
    renderChart();
  }
}

function renderChart() {
  const now = new Date();
  let pts = hist;
  if (chartRange < 9999) {
    const cut = new Date(now - chartRange*86400000).toISOString().slice(0,10);
    pts = hist.filter(p => p.date >= cut);
  }
  if (!pts.length) return;
  const labels = pts.map(p=>p.date.slice(5));
  const data   = pts.map(p=>p.total);
  if (myChart) myChart.destroy();
  const ctx = document.getElementById('chart').getContext('2d');
  const grad = ctx.createLinearGradient(0,0,0,190);
  grad.addColorStop(0,'rgba(88,166,255,.22)');
  grad.addColorStop(1,'rgba(88,166,255,0)');
  myChart = new Chart(ctx, {
    type:'line',
    data:{labels, datasets:[{data, borderColor:'#58a6ff', backgroundColor:grad,
      borderWidth:2, pointRadius:data.length<=30?3:0, pointHoverRadius:5, fill:true, tension:.3}]},
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{legend:{display:false}, tooltip:{callbacks:{label:c=>`NT$ ${c.raw.toLocaleString()}`}}},
      scales:{
        x:{grid:{color:'#21262d'}, ticks:{color:'#8b949e', maxTicksLimit:8}},
        y:{grid:{color:'#21262d'}, ticks:{color:'#8b949e',
          callback:v=>'NT$'+(v>=1e6?(v/1e6).toFixed(1)+'M':(v/1000).toFixed(0)+'K')}}
      }
    }
  });
}

function setRange(btn, r) {
  chartRange = r;
  document.querySelectorAll('.range-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderChart();
}

// ── Refresh ──────────────────────────────────────────────────
async function refreshAll() {
  document.getElementById('last-update').textContent = '更新中…';
  await fetchUsdRate();
  const [twVal, usVal] = await Promise.all([renderTw(), renderUs()]);
  const bankVal = renderBank();
  renderTxns();
  updateTotals(twVal, usVal, bankVal);
  document.getElementById('last-update').textContent =
    '更新 ' + new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
}

// ── Modal helpers ────────────────────────────────────────────
function openModal(title, body, saveBtnText='儲存') {
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-body').innerHTML = body;
  document.getElementById('modal-save-btn').textContent = saveBtnText;
  document.getElementById('modal-overlay').classList.add('open');
}
function closeModal() { document.getElementById('modal-overlay').classList.remove('open'); }
document.getElementById('modal-overlay').addEventListener('click', e => {
  if (e.target === document.getElementById('modal-overlay')) closeModal();
});

// ── Add Holding Modal ────────────────────────────────────────
function openAddModal(type) {
  _modal = { mode: type+'-add', idx: -1 };
  if (type === 'tw') {
    openModal('新增台股', `
      <div class="fg"><label>股票代號（如 2330）</label><input id="f-ticker" placeholder="2330"></div>
      <div class="fg"><label>名稱（可留空自動抓）</label><input id="f-name" placeholder="台積電"></div>
      <div class="row2">
        <div class="fg"><label>股數</label><input id="f-shares" type="number" placeholder="1000"></div>
        <div class="fg"><label>均價（TWD）</label><input id="f-avg" type="number" step="0.01" placeholder="950"></div>
      </div>`);
  } else if (type === 'us') {
    openModal('新增美股', `
      <div class="fg"><label>股票代號（如 NVDA）</label><input id="f-ticker" placeholder="NVDA"></div>
      <div class="fg"><label>名稱（可留空自動抓）</label><input id="f-name" placeholder="NVIDIA"></div>
      <div class="row2">
        <div class="fg"><label>股數</label><input id="f-shares" type="number" step="0.001" placeholder="10"></div>
        <div class="fg"><label>均價（USD）</label><input id="f-avg" type="number" step="0.01" placeholder="500"></div>
      </div>`);
  } else {
    openModal('新增存摺', `
      <div class="fg"><label>銀行名稱</label><input id="f-bank" placeholder="台灣銀行"></div>
      <div class="fg"><label>備註</label><input id="f-note" placeholder="活存 / 定存 / 外幣"></div>
      <div class="fg"><label>金額（TWD）</label><input id="f-amount" type="number" placeholder="500000"></div>`);
  }
}

// ── Edit Holding Modal ────────────────────────────────────────
function openEditHolding(market, idx) {
  _modal = { mode: market+'-edit', idx };
  const h = market === 'tw' ? twH[idx] : usH[idx];
  const cur = market === 'tw' ? 'TWD' : 'USD';
  openModal(`編輯 ${h.ticker}`, `
    <div class="fg"><label>股票代號</label><input id="f-ticker" value="${h.ticker}"></div>
    <div class="fg"><label>名稱</label><input id="f-name" value="${h.name||''}"></div>
    <div class="row2">
      <div class="fg"><label>股數</label><input id="f-shares" type="number" step="0.001" value="${h.shares}"></div>
      <div class="fg"><label>均價（${cur}）</label><input id="f-avg" type="number" step="0.01" value="${h.avgPrice}"></div>
    </div>`);
}

// ── Edit Bank Modal ───────────────────────────────────────────
function openEditBank(idx) {
  _modal = { mode: 'bank-edit', idx };
  const b = bank[idx];
  openModal('編輯存摺', `
    <div class="fg"><label>銀行名稱</label><input id="f-bank" value="${b.bankName}"></div>
    <div class="fg"><label>備註</label><input id="f-note" value="${b.note||''}"></div>
    <div class="fg"><label>金額（TWD）</label><input id="f-amount" type="number" value="${b.amount}"></div>`);
}

// ── Trade Modal (BUY / SELL) ─────────────────────────────────
function openTrade(type, market, idx) {
  _modal = { mode: 'trade', tradeType: type, market, idx };
  const h = market === 'tw' ? twH[idx] : usH[idx];
  const cur = market === 'tw' ? 'TWD' : 'USD';
  const label = type === 'BUY' ? '買進' : '賣出';
  const color = type === 'BUY' ? 'var(--green)' : 'var(--red)';
  document.getElementById('modal-save-btn').style.background = color;

  const info = type === 'SELL'
    ? `<div class="info-box">目前持有 <b>${fmt(h.shares)}</b> 股，均價 <b>${n2(h.avgPrice)} ${cur}</b><br>成本 <b>${n2(h.shares*h.avgPrice)} ${cur}</b></div>`
    : `<div class="info-box">現有持股 <b>${fmt(h.shares)}</b> 股，均價 <b>${n2(h.avgPrice)} ${cur}</b></div>`;

  openModal(`${label}｜${h.ticker} ${h.name||''}`, `
    ${info}
    <div class="row2">
      <div class="fg"><label>${label}股數</label>
        <input id="f-shares" type="number" step="${market==='us'?'0.001':'1'}" placeholder="0" ${type==='SELL'?`max="${h.shares}"`:''}>
      </div>
      <div class="fg"><label>${label}價格（${cur}）</label>
        <input id="f-price" type="number" step="0.01" placeholder="0">
      </div>
    </div>
    <div class="fg"><label>日期</label>
      <input id="f-date" type="date" value="${new Date().toISOString().slice(0,10)}">
    </div>
    <div id="trade-preview" style="margin-top:6px;font-size:12px;color:var(--text2);">填入股數與價格後自動計算</div>`,
    label
  );

  // Live preview
  setTimeout(() => {
    ['f-shares','f-price'].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.addEventListener('input', updateTradePreview);
    });
  }, 50);
}

function updateTradePreview() {
  const { market, idx, tradeType } = _modal;
  const h = market === 'tw' ? twH[idx] : usH[idx];
  const shares = parseFloat(document.getElementById('f-shares')?.value) || 0;
  const price  = parseFloat(document.getElementById('f-price')?.value)  || 0;
  const cur = market === 'tw' ? 'TWD' : 'USD';
  const prev = document.getElementById('trade-preview');
  if (!prev || !shares || !price) return;
  const amount = shares * price;
  if (tradeType === 'BUY') {
    const newShares = h.shares + shares;
    const newCost   = h.shares * h.avgPrice + amount;
    const newAvg    = newCost / newShares;
    prev.innerHTML = `交易金額 <b>${n2(amount)} ${cur}</b>　買後均價 <b>${n2(newAvg)} ${cur}</b>　持股 <b>${fmt(newShares)}</b>`;
  } else {
    const realized = (price - h.avgPrice) * shares;
    const cls = realized>=0?'pos':'neg';
    prev.innerHTML = `交易金額 <b>${n2(amount)} ${cur}</b>　實現損益 <b class="${cls}">${realized>=0?'+':''}${n2(realized)} ${cur}</b>`;
  }
}

// ── Save Modal ────────────────────────────────────────────────
function saveModal() {
  const { mode } = _modal;

  if (mode === 'tw-add' || mode === 'us-add') {
    const ticker = (document.getElementById('f-ticker')?.value||'').trim().toUpperCase();
    const name   = (document.getElementById('f-name')?.value||'').trim();
    const shares = parseFloat(document.getElementById('f-shares')?.value);
    const avg    = parseFloat(document.getElementById('f-avg')?.value);
    if (!ticker || !shares || !avg) return alert('請填寫代號、股數與均價');
    const arr = mode.startsWith('tw') ? twH : usH;
    const key = mode.startsWith('tw') ? 'tw_h' : 'us_h';
    arr.push({ ticker, name, shares, avgPrice: avg });
    S.set(key, arr);

  } else if (mode === 'tw-edit' || mode === 'us-edit') {
    const { idx } = _modal;
    const ticker = (document.getElementById('f-ticker')?.value||'').trim().toUpperCase();
    const name   = (document.getElementById('f-name')?.value||'').trim();
    const shares = parseFloat(document.getElementById('f-shares')?.value);
    const avg    = parseFloat(document.getElementById('f-avg')?.value);
    if (!ticker || !shares || !avg) return alert('請填寫代號、股數與均價');
    const arr = mode.startsWith('tw') ? twH : usH;
    const key = mode.startsWith('tw') ? 'tw_h' : 'us_h';
    arr[idx] = { ticker, name, shares, avgPrice: avg };
    S.set(key, arr);

  } else if (mode === 'bank-add') {
    const bankName = (document.getElementById('f-bank')?.value||'').trim();
    const note     = (document.getElementById('f-note')?.value||'').trim();
    const amount   = parseFloat(document.getElementById('f-amount')?.value);
    if (!bankName || !amount) return alert('請填寫銀行名稱與金額');
    bank.push({ id: Date.now(), bankName, note, amount });
    S.set('bank', bank);

  } else if (mode === 'bank-edit') {
    const { idx } = _modal;
    const bankName = (document.getElementById('f-bank')?.value||'').trim();
    const note     = (document.getElementById('f-note')?.value||'').trim();
    const amount   = parseFloat(document.getElementById('f-amount')?.value);
    if (!bankName || !amount) return alert('請填寫銀行名稱與金額');
    bank[idx] = { ...bank[idx], bankName, note, amount };
    S.set('bank', bank);

  } else if (mode === 'trade') {
    const { tradeType, market, idx } = _modal;
    const arr = market === 'tw' ? twH : usH;
    const key = market === 'tw' ? 'tw_h' : 'us_h';
    const h   = arr[idx];
    const shares = parseFloat(document.getElementById('f-shares')?.value);
    const price  = parseFloat(document.getElementById('f-price')?.value);
    const date   = document.getElementById('f-date')?.value || new Date().toISOString().slice(0,10);
    if (!shares || shares <= 0 || !price || price <= 0) return alert('請填寫股數與價格');

    if (tradeType === 'BUY') {
      const newShares = h.shares + shares;
      const newAvg    = (h.shares * h.avgPrice + shares * price) / newShares;
      arr[idx].shares   = parseFloat(newShares.toFixed(6));
      arr[idx].avgPrice = parseFloat(newAvg.toFixed(6));
      txns.push({
        id: Date.now(), date, type: 'BUY', market: market.toUpperCase(),
        ticker: h.ticker, name: h.name||'', shares, price, realizedPnl: null
      });
    } else {
      if (shares > h.shares) return alert(`超過持有股數 ${fmt(h.shares)}`);
      const realized = (price - h.avgPrice) * shares;
      const newShares = parseFloat((h.shares - shares).toFixed(6));
      if (newShares <= 0.0001) arr.splice(idx, 1);
      else arr[idx].shares = newShares;
      txns.push({
        id: Date.now(), date, type: 'SELL', market: market.toUpperCase(),
        ticker: h.ticker, name: h.name||'', shares, price, realizedPnl: parseFloat(realized.toFixed(4))
      });
    }
    S.set(key, arr);
    S.set('txns', txns);
  }

  closeModal();
  refreshAll();
}

// ── Delete helpers ────────────────────────────────────────────
function delHolding(market, idx) {
  if (!confirm('確定刪除此持倉？交易紀錄不會刪除。')) return;
  if (market === 'tw') { twH.splice(idx,1); S.set('tw_h',twH); }
  else                 { usH.splice(idx,1); S.set('us_h',usH); }
  refreshAll();
}
function delBank(idx) {
  if (!confirm('確定刪除？')) return;
  bank.splice(idx,1); S.set('bank',bank); refreshAll();
}

// ── Formatters ────────────────────────────────────────────────
function twd(v)  { return v==null ? '—' : 'NT$'+Math.round(v).toLocaleString(); }
function n2(v)   { return v==null ? '—' : parseFloat(v).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fmt(v)  { return v==null ? '—' : parseFloat(v).toLocaleString(); }

// ── Auto refresh every 60s ────────────────────────────────────
setInterval(refreshAll, 60000);

// ── Init ──────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', () => {
  renderChart();
  refreshAll();
});
</script>
