name: Update Stock Prices

on:
  schedule:
    # 台股盤中 09:00-13:30 CST = 01:00-05:30 UTC (Mon-Fri)
    - cron: '*/30 1-5 * * 1-5'
    # 美股盤中 09:30-16:00 EST = 14:30-21:00 UTC (Mon-Fri)
    - cron: '*/30 14-21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch prices
        run: python fetch_prices.py

      - name: Commit prices.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add prices.json
          git diff --staged --quiet || git commit -m "prices: $(date -u '+%Y-%m-%d %H:%M') UTC"
          git push
